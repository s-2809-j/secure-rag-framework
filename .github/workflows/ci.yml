name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f sentinel-backend/requirements.txt ]; then pip install -r sentinel-backend/requirements.txt; fi
        if [ -f sentinel-Ai/requirements.txt ]; then pip install -r sentinel-Ai/requirements.txt; fi

    - name: Run verification checks
      run: |
        echo "CI pipeline executed successfully."
